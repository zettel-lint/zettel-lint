name: Feature Ferret Scheduled Task

on:
  schedule:
    # Run every Thursday at 8:00 AM UTC
    - cron: '0 8 * * 4'
  workflow_dispatch:

jobs:
  feature-ferret:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      - name: Run lint and test
        run: |
          npm run lint
          npm test
